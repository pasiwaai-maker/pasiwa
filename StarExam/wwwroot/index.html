<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星星考題樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Chiron+GoRound+TC:wght@400;600;800&display=swap">
<style>
/* Layout: a sky-blue graph-paper playground; chunky sticker cards with hard offset shadows; one mascot (星寶) guides every screen */
:root{
  --sky:#DDF1FF; --grid:#C5E4FA; --paper:#FFFFFF; --ink:#1F2A55; --ink-soft:#5A6690;
  --sun:#FFC93C; --coral:#FF6F61; --mint:#2EC4A0; --berry:#5B7CFA; --line:#1F2A55;
  --ok:#21A67A; --ok-bg:#DDF7EC; --bad:#E5484D; --bad-bg:#FFE4E3; --hint-bg:#FFF4CC;
  --shadow:#1F2A55; --chip:#F1F6FF;
  --f-display:"Baloo 2","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#141B33; --grid:#1D2747; --paper:#1F2847; --ink:#F1F4FF; --ink-soft:#A9B3DA;
  --sun:#FFC93C; --coral:#FF8A7E; --mint:#3ED6B0; --berry:#8098FF; --line:#0B1022;
  --ok:#46D69E; --ok-bg:#163B32; --bad:#FF7A7E; --bad-bg:#43202A; --hint-bg:#3A3320;
  --shadow:#070B18; --chip:#27325A; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#141B33; --grid:#1D2747; --paper:#1F2847; --ink:#F1F4FF; --ink-soft:#A9B3DA;
  --sun:#FFC93C; --coral:#FF8A7E; --mint:#3ED6B0; --berry:#8098FF; --line:#0B1022;
  --ok:#46D69E; --ok-bg:#163B32; --bad:#FF7A7E; --bad-bg:#43202A; --hint-bg:#3A3320;
  --shadow:#070B18; --chip:#27325A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.sticker{background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--shadow)}
.btn{border:3px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:800;font-size:16px;background:var(--paper);
  box-shadow:3px 3px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--sun);color:#1F2A55}
.btn.mint{background:var(--mint);color:#10213A}
.btn.coral{background:var(--coral);color:#fff}
.btn.small{padding:6px 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 240px;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-body);font-weight:800;font-size:clamp(20px,4.5vw,26px);letter-spacing:.04em}
.brand small{display:block;font-size:12px;color:var(--ink-soft);letter-spacing:.08em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill-stat{display:flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.pill-stat .n{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px 22px;background:var(--sun);color:#1F2A55}
.hero h1{font-size:clamp(22px,5vw,32px);font-weight:800}
.hero p{margin:4px 0 0;font-size:15px}
.bubble{position:relative;background:#fff;color:#1F2A55;border:3px solid #1F2A55;border-radius:18px;padding:10px 14px;font-weight:600;font-size:15px}
.mascot{width:96px;height:96px;flex:none}
.mascot.bounce{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}

/* picker */
.step{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.step-h{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.step-h .no{font-family:var(--f-display);font-weight:800;background:var(--line);color:var(--sun);border-radius:999px;width:30px;height:30px;display:grid;place-items:center;font-size:16px;flex:none}
.step-h h2{font-size:19px;flex:1 1 auto;min-width:0}
.step-h span:not(.no){flex-basis:100%;padding-left:40px}
.step-h span{color:var(--ink-soft);font-size:13px}
.ver-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ver{border:3px solid var(--line);border-radius:18px;padding:12px 8px 10px;background:var(--chip);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:17px;transition:transform .15s}
.ver .badge{width:46px;height:46px;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center;font-size:22px;color:#fff;transform:rotate(-6deg)}
.ver small{font-weight:600;font-size:12px;color:var(--ink-soft)}
.ver[aria-pressed="true"]{background:var(--paper);transform:translateY(-4px);box-shadow:4px 5px 0 var(--shadow)}
.ver[aria-pressed="true"] .badge{animation:wiggle .5s}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}30%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(-12deg)}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--chip);font-weight:800;font-size:16px;transition:transform .12s}
.chip[aria-pressed="true"]{background:var(--berry);color:#fff;transform:translateY(-3px);box-shadow:3px 4px 0 var(--shadow)}
.subj-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.subj{border:3px solid var(--line);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:16px;color:#1F2A55;transition:transform .15s}
.subj svg{width:40px;height:40px}
.subj[aria-pressed="true"]{transform:translateY(-4px) rotate(-2deg);box-shadow:4px 5px 0 var(--shadow)}
.subj[aria-pressed="false"]{filter:saturate(.75)}

.paper-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.term{display:flex;flex-direction:column;gap:8px;min-width:0}
.term h3{font-size:16px;display:flex;align-items:center;gap:6px}
.term h3 i{font-style:normal;font-size:12px;color:var(--ink-soft);font-weight:600}
.paper{border:2.5px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-weight:700;font-size:15px;transition:transform .12s, background .12s}
.paper:hover{transform:translateX(3px);background:var(--hint-bg)}
.paper .yr{font-family:var(--f-display);font-weight:800;font-size:17px}
.stars{display:flex;gap:1px;font-size:15px;letter-spacing:-1px}
.stars .on{color:#F5A700}.stars .off{color:var(--grid)}
.extra-row{display:flex;flex-wrap:wrap;gap:10px}
.scope-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scope{border:3px solid var(--line);border-radius:18px;background:var(--paper);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;transition:transform .12s, box-shadow .12s}
.scope:hover{transform:translateY(-3px);box-shadow:4px 5px 0 var(--shadow)}
.scope.all{background:var(--hint-bg)}
.scope-t{font-weight:800;font-size:18px}
.scope-d{font-size:13px;color:var(--ink-soft);font-weight:600}
.scope-f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scope .go{margin-top:auto;font-weight:800;font-size:14px;background:var(--sun);color:#1F2A55;border:2.5px solid var(--line);border-radius:999px;padding:2px 12px}
.parent-btn{background:var(--berry);color:#fff}
.pm-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 22px;background:var(--berry);color:#fff}
.pm-head h1{font-size:clamp(22px,5vw,30px)}
.pm-head p{margin:4px 0 0;opacity:.92;font-size:14.5px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{border:3px solid var(--line);border-radius:18px;background:var(--chip);padding:10px 22px;font-family:var(--f-display);font-weight:800;font-size:22px;min-width:96px}
.seg button small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--sun);color:#1F2A55;transform:translateY(-3px);box-shadow:3px 4px 0 var(--shadow)}
.seg button[aria-pressed="true"] small{color:#1F2A55}
.tbl-wrap{overflow-x:auto;border:2.5px solid var(--line);border-radius:14px}
table.tbl{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 10px;text-align:left;border-bottom:1.5px solid var(--grid);white-space:nowrap}
.tbl th{background:var(--chip);font-weight:800}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.kv{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field input[type=text],.field input[type=url],.field input[type=email],.field input[type=password],.modal input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;padding:9px 14px;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
.modal input{width:100%;text-align:center;font-size:22px;letter-spacing:.3em}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:14.5px;background:var(--hint-bg);white-space:pre-wrap}
.msg.ok{background:var(--ok-bg)}.msg.bad{background:var(--bad-bg)}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{color:var(--ink);font-weight:800;border:2.5px solid var(--line);border-radius:999px;padding:4px 14px;text-decoration:none;background:var(--chip)}
.grade-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qimg{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.qimg img{max-width:100%;max-height:360px;border:2.5px solid var(--line);border-radius:12px;background:#fff;cursor:zoom-in}
.qimg figcaption{font-size:12px;color:var(--ink-soft)}
.oimg{display:block;max-width:100%;max-height:140px;border-radius:8px;background:#fff;margin-bottom:4px}
.imp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.imp-grid label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px;min-width:0}
.imp-grid label.wide{grid-column:1/-1}
.imp-grid select,.imp-grid input{font:inherit;font-size:15px;padding:8px 10px;border:2.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0}
.ed-list{display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto;padding:4px}
.ed-card{border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.ed-card.warn{background:var(--hint-bg)}
.ed-card.off{opacity:.45}
.ed-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.ed-top select,.ed-top input:not([type]),.ed-card textarea,.ed-opt input:not([type=radio]),.ed-line input{font:inherit;font-size:14.5px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
.ed-card textarea{width:100%;resize:vertical}
.ed-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed-opt{display:flex;align-items:center;gap:6px;min-width:0}.ed-opt input:not([type=radio]){flex:1}
.ed-line{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700}
.crop-modal{max-width:min(96vw,980px)!important}
.crop-wrap{max-height:62vh;overflow:auto;border:2px solid var(--line);border-radius:10px;background:#fff}
.crop-wrap canvas{display:block;max-width:100%;cursor:crosshair;touch-action:none}
.draft{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;border:2.5px solid var(--line);border-radius:14px;padding:10px}
.draft-item{display:flex;gap:10px;align-items:flex-start;border-bottom:1.5px solid var(--grid);padding-bottom:8px}
.draft-body{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:14.5px}
.draft-oimg{max-width:90px;max-height:60px;border:1px solid var(--line);border-radius:6px;background:#fff;vertical-align:middle}
.draft-img{max-width:260px;max-height:160px;border:2px solid var(--line);border-radius:8px;background:#fff}
.draft-opts{display:flex;gap:6px;flex-wrap:wrap}.draft-opts img{max-height:70px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
.cfg-details summary{cursor:pointer;font-weight:800;margin:6px 0}
.cfg-details{display:flex;flex-direction:column;gap:8px}
.shop-btn{background:var(--coral);color:#fff}
.shop-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 22px;background:var(--berry);color:#fff}
.shop-head h1{font-size:clamp(24px,5vw,32px)}
.shop-head p{margin:4px 0 0}
.big-n{font-family:var(--f-display);font-size:24px;color:#FFE27A}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.skin-card{padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.skin-card.locked .skin-prev{filter:grayscale(.7) brightness(.9)}
.skin-prev{position:relative;height:130px;border:2.5px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.skin-m{width:96px;height:96px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.skin-sw{position:absolute;bottom:8px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.35)}
.skin-sw:nth-of-type(1){left:8px}.skin-sw:nth-of-type(2){left:28px}.skin-sw:nth-of-type(3){left:48px}
.lock{position:absolute;top:6px;right:8px;font-size:22px}
.skin-info h3{font-size:17px}.skin-info p{margin:2px 0 6px;font-size:13.5px;color:var(--ink-soft)}
.skin-card .btn{align-self:stretch}
.skin-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.skin-chip{display:flex;align-items:center;gap:8px;border:2.5px solid var(--line);border-radius:14px;background:var(--chip);padding:6px 10px;text-align:left;font-weight:800;font-size:14.5px;min-width:0}
.skin-chip svg{width:44px;height:44px;flex:none}
.skin-chip small{display:block;font-weight:600;font-size:12px;color:var(--ink-soft)}
.skin-chip[aria-pressed="true"]{background:var(--sun);color:#1F2A55;box-shadow:3px 3px 0 var(--shadow)}
.skin-chip[aria-pressed="true"] small{color:#1F2A55}
.preview-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;padding:8px 14px;display:flex;gap:10px;align-items:center;font-weight:800;max-width:calc(100% - 32px)}
.level-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ltab{border:3px solid var(--line);border-radius:20px 20px 12px 12px;background:var(--paper);padding:12px 10px;font-weight:800;font-size:clamp(20px,4.5vw,26px);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s, box-shadow .15s}
.ltab small{font-size:13px;font-weight:700;color:var(--ink-soft)}
.ltab[aria-selected="true"].el{background:var(--sun);color:#1F2A55;transform:translateY(-4px);box-shadow:5px 5px 0 var(--shadow)}
.ltab[aria-selected="true"].jh{background:var(--mint);color:#10213A;transform:translateY(-4px);box-shadow:5px 5px 0 var(--shadow)}
.ltab[aria-selected="true"] small{color:inherit}
.ltab[aria-selected="false"]{opacity:.8}
.grade-lbl{font-weight:800;font-size:13px;letter-spacing:.1em;border:2.5px solid var(--line);border-radius:10px;padding:2px 8px;background:var(--sun);color:#1F2A55}
.grade-lbl.jh{background:var(--mint);color:#10213A}
.chip.jh[aria-pressed="true"]{background:var(--mint);color:#10213A}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 20px;font-weight:800;z-index:40;animation:zoom .25s;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;max-width:70ch}

/* exam */
.exam-head{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.exam-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exam-title h2{font-size:19px;flex:1;min-width:0}
.timer{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--chip);border:2.5px solid var(--line);border-radius:999px;padding:2px 12px}
.track{height:16px;border:3px solid var(--line);border-radius:999px;background:var(--chip);overflow:hidden}
.track i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 10px,#5ad8b8 10px 20px);transition:width .35s}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:36px;height:36px;border-radius:12px;border:2.5px solid var(--line);background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:15px}
.dot.done{background:var(--sun);color:#1F2A55}
.dot.cur{outline:3px solid var(--berry);outline-offset:2px}
.qcard{padding:22px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12.5px;font-weight:800;border:2px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--chip)}
.tag.type{background:var(--berry);color:#fff}
.qtext{font-size:clamp(17px,3.6vw,20px);font-weight:600;line-height:1.75;white-space:pre-wrap}
.qtext .num{font-family:var(--f-display);font-weight:800;color:var(--coral);margin-right:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:12px 14px;text-align:left;font-size:17px;font-weight:600;min-width:0;transition:transform .12s, background .12s}
.opt:hover{background:var(--chip);transform:translateY(-2px)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;border:2.5px solid var(--line);color:#1F2A55}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{background:var(--sun);color:#1F2A55;box-shadow:3px 3px 0 var(--shadow);transform:translateY(-2px)}
.tf{display:flex;gap:18px;justify-content:center}
.tf .opt{flex:0 1 180px;justify-content:center;flex-direction:column;padding:14px}
.tf .mark{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1}
.fill{display:flex;gap:10px;flex-wrap:wrap}
.fill input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;padding:10px 16px;border:3px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);border-bottom-width:6px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sparkle{position:absolute;pointer-events:none;font-size:22px;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,48,.55);display:grid;place-items:center;padding:20px;z-index:20}
.modal{max-width:420px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:zoom .25s}
@keyframes zoom{from{transform:scale(.8);opacity:0}}

/* result */
.result-top{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score{position:relative;width:150px;height:150px}
.score svg{width:100%;height:100%;transform:rotate(-90deg)}
.score .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.score .v b{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score .v small{display:block;font-size:13px;color:var(--ink-soft);font-weight:700}
.big-stars{font-size:40px;letter-spacing:4px}
.big-stars span{display:inline-block;color:var(--grid)}
.big-stars span.on{color:#F5A700;animation:starIn .5s both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.35)}}
.result-msg h2{font-size:24px}
.result-msg p{margin:6px 0 12px;color:var(--ink-soft)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.review-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.review-h h2{font-size:20px;flex:1}
.ritem{padding:18px;display:flex;flex-direction:column;gap:10px;border-left-width:10px}
.ritem.ok{border-left-color:var(--ok)}.ritem.bad{border-left-color:var(--bad)}
.verdict{font-weight:800;font-size:14px;border-radius:999px;padding:2px 12px;border:2px solid currentColor}
.ritem.ok .verdict{color:var(--ok);background:var(--ok-bg)}.ritem.bad .verdict{color:var(--bad);background:var(--bad-bg)}
.rq{font-size:17px;font-weight:600;white-space:pre-wrap}
.ropts{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:15px}
.ropt{border:2px solid var(--grid);border-radius:12px;padding:6px 10px;min-width:0;overflow-wrap:anywhere}
.ropt.right{border-color:var(--ok);background:var(--ok-bg);font-weight:700}
.ropt.mine{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.ans-line{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.ans-line b{font-weight:800}
.explain{background:var(--hint-bg);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.explain .lbl{font-weight:800;margin-right:4px}
.explain .warn{color:var(--bad)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.empty{padding:28px;text-align:center;color:var(--ink-soft)}
.foot{font-size:12px;color:var(--ink-soft);text-align:center}
@media (max-width:640px){
  .shop-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .imp-grid{grid-template-columns:1fr 1fr}
  .scope-grid{grid-template-columns:1fr 1fr}
  .pm-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .brand small{display:none}
  .paper-grid{grid-template-columns:1fr}
  .opts,.ropts{grid-template-columns:1fr}
  .result-top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .kpis{justify-content:center}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .ver-row{gap:8px}.ver{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

const HOST = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;   // Windows 程式（WebView2）

/* ---------- constants ---------- */
const VERS = [

  {id:'nan',  name:'南一版', short:'南', color:'#2EC4A0'},

const SUBJ = {

  math:{name:'數學', color:'#FFD66B', icon:'<svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="6" fill="#fff" stroke="#1F2A55" stroke-width="3"/><path d="M12 14h6M15 11v6M23 14h6M12 26l5-5M12 21l5 5M23 24h6M26 21h0M26 27h0" stroke="#1F2A55" stroke-width="2.8" stroke-linecap="round"/></svg>'},
  english:{name:'英語', color:'#A9C1FF', icon:'<svg viewBox="0 0 40 40"><path d="M7 10h20a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-9l-7 6v-6H7z" fill="#fff" stroke="#1F2A55" stroke-width="3" stroke-linejoin="round"/><text x="19" y="23" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="12" fill="#1F2A55">ABC</text></svg>'},
  life:{name:'生活', color:'#B8EFA0', icon:'<svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="6" fill="#fff" stroke="#1F2A55" stroke-width="3"/><path d="M20 21v13M20 27c-6 0-9-3-10-7 5 0 8 2 10 7zM20 25c5 0 8-3 9-7-5 0-8 2-9 7z" fill="#fff" stroke="#1F2A55" stroke-width="2.6" stroke-linejoin="round"/></svg>'},

  society:{name:'社會', color:'#FFC7E6', icon:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="#fff" stroke="#1F2A55" stroke-width="3"/><path d="M7 20h26M20 7c5 5 5 21 0 26M20 7c-5 5-5 21 0 26" fill="none" stroke="#1F2A55" stroke-width="2.4"/></svg>'},

SUBJ.hess={name:'何嘉仁美語', color:'#FFD0A1', icon:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#fff" stroke="#1F2A55" stroke-width="3"/><text x="20" y="25" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="13" fill="#1F2A55">Hi!</text></svg>'};
SUBJ.ltie={name:'大家說英語', color:'#C9B8FF', icon:'<svg viewBox="0 0 40 40"><rect x="9" y="6" width="22" height="28" rx="3" fill="#fff" stroke="#1F2A55" stroke-width="3"/><path d="M14 13h12M14 18h12M14 23h8" stroke="#1F2A55" stroke-width="2.6" stroke-linecap="round"/><circle cx="29" cy="29" r="6" fill="#FFC93C" stroke="#1F2A55" stroke-width="2.5"/></svg>'};

SUBJ.his={name:'歷史', color:'#F7C59F', icon:'<svg viewBox="0 0 40 40"><path d="M12 8h18v24H12a4 4 0 0 1 0-8h18" fill="#fff" stroke="#1F2A55" stroke-width="3" stroke-linejoin="round"/><path d="M16 13h10M16 18h8" stroke="#1F2A55" stroke-width="2.4" stroke-linecap="round"/></svg>'};
SUBJ.earth={name:'地球科學', color:'#B9D7FF', icon:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="#fff" stroke="#1F2A55" stroke-width="3"/><path d="M9 15c4 1 6-2 9 0s2 6 6 6 5-3 7-2M12 27c3-2 6 0 8 2" fill="none" stroke="#1F2A55" stroke-width="2.4" stroke-linecap="round"/><circle cx="31" cy="9" r="3" fill="#FFC93C" stroke="#1F2A55" stroke-width="2"/></svg>'};

// 國中社會拆成地理／歷史／公民：舊資料（s=society、unit 以「地理：」「歷史：」「公民：」開頭）自動轉換
function fixSubj(q){
  // 國小學校科目只有兩次段考：舊資料的第 3 次段考併入第 2 次
  if(q && q.g<=6 && q.e===3 && q.s!=='hess') q.e=2;
  if(q && q.s==='society' && q.g>=7){
    const m=String(q.unit||'').match(/^\s*(地理|歷史|公民)\s*[：:]?\s*/);
    q.s = m ? {地理:'geo',歷史:'his',公民:'civ'}[m[1]] : 'civ';
    if(m) q.unit = q.unit.slice(m[0].length) || m[1];
  }
  // 九年級自然拆成理化（nature）與地球科學（earth）：舊資料依單元名稱自動歸類
  if(q && q.s==='nature' && q.g===9 && isEarthUnit(q.unit)){ q.s='earth'; q.unit=String(q.unit).replace(/^\s*地科\s*[：:]\s*/,''); }
  return q;
}
function isEarthUnit(u){ u=String(u||''); if(/^\s*理化\s*[：:]/.test(u)||/大氣壓力/.test(u)) return false;
  return /^\s*地科|地球|板塊|岩|礦物|地層|化石|地震|火山|斷層|褶皺|風化|侵蝕|沉積|外營力|內營力|河流作用|下陷|太陽系|天體|天文|宇宙|恆星|行星|月相|日食|月食|潮汐|晝夜|四季|季節|大氣|天氣|氣壓與風|氣團|鋒面|颱風|季風|梅雨|聖嬰|溫室效應|暖化|氣候變遷|天然災害/.test(u); }

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const starsOf = sc => sc>=90?3:sc>=70?2:sc>=50?1:0;
const starHTML = n => `<span class="stars" aria-label="${n} 顆星">${[0,1,2].map(i=>`<span class="${i<n?'on':'off'}">★</span>`).join('')}</span>`;
function norm(t){return String(t).replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' ').replace(/\s+/g,'').replace(/[。．.]$/,'').toLowerCase()}
function fillCorrect(input, answers){
  const u = norm(input); if(!u) return false;
  return answers.some(a=>{const n=norm(a); if(n===u) return true;
    const strip=x=>x.replace(/[^0-9a-z:\/\-]/g,'');   // allow missing/extra unit on numeric answers
    return /^[0-9]/.test(n) && strip(n)!=='' && strip(n)===strip(u) && /^[0-9]/.test(u);});
}

/* ---------- sound ---------- */
let actx=null;
function beep(kind){
  if(!sound) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={tap:[[660,.05]],ok:[[660,.08],[880,.12]],bad:[[300,.12],[220,.16]],win:[[523,.1],[659,.1],[784,.1],[1046,.25]]}[kind]||[];
    let t=actx.currentTime;
    for(const [f,d] of seq){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.9}
  }catch(e){}
}

function face(mood,ink,dy=0,cheek='#FF9C8F'){
  const y=v=>v+dy;
  const mouth = mood==='happy' ? `<path d="M40 ${y(60)}q10 10 20 0" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`
    : mood==='wow' ? `<ellipse cx="50" cy="${y(62)}" rx="7" ry="8" fill="${ink}"/><ellipse cx="50" cy="${y(65)}" rx="4" ry="3" fill="#FF6F61"/>`
    : `<path d="M41 ${y(66)}q9-8 18 0" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
  const eyes = mood==='wow' ? `<path d="M33 ${y(46)}l5-5 5 5M57 ${y(46)}l5-5 5 5" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<circle cx="38" cy="${y(46)}" r="5" fill="${ink}"/><circle cx="62" cy="${y(46)}" r="5" fill="${ink}"/><circle cx="40" cy="${y(44)}" r="1.6" fill="#fff"/><circle cx="64" cy="${y(44)}" r="1.6" fill="#fff"/>`;
  const ch = cheek?`<circle cx="30" cy="${y(56)}" r="5" fill="${cheek}" opacity=".8"/><circle cx="70" cy="${y(56)}" r="5" fill="${cheek}" opacity=".8"/>`:'';
  return ch+eyes+mouth;
}

    : mood==='sad' ? `<rect x="32" y="${y(45)}" width="12" height="4" rx="2" fill="${c}"/><rect x="56" y="${y(45)}" width="12" height="4" rx="2" fill="${c}"/>`
    : `<rect x="32" y="${y(40)}" width="12" height="9" rx="4" fill="${c}"/><rect x="56" y="${y(40)}" width="12" height="9" rx="4" fill="${c}"/>`;
  const mouth = mood==='happy' ? `<path d="M40 ${y(58)}h20l-3 5h-14z" fill="${c}"/>` : mood==='wow' ? `<rect x="45" y="${y(56)}" width="10" height="8" rx="2" fill="${c}"/>` : `<rect x="40" y="${y(60)}" width="20" height="3" rx="1.5" fill="${c}"/>`;
  return eyes+mouth;
}

const curSkin=()=>SKINS.find(s=>s.id===(previewSkin||skinId))||SKINS[0];
function applySkin(){
  const s=curSkin(); const root=document.documentElement;
  let st=document.getElementById('skinStyle'); if(!st){st=document.createElement('style');st.id='skinStyle';document.head.appendChild(st);}
  if(!s.vars){ delete root.dataset.skin; st.textContent=''; }
  else{
    const v=s.vars; root.dataset.skin=s.id;
    st.textContent=`:root[data-skin="${s.id}"]{--sky:${v.sky};--grid:${v.grid};--paper:${v.paper};--ink:${v.ink};--ink-soft:${v.inkSoft};--sun:${v.sun};--coral:${v.coral};--mint:${v.mint};--berry:${v.berry};--line:${v.line};--shadow:${v.shadow};--chip:${v.chip};--hint-bg:${v.hint};${v.okbg?`--ok-bg:${v.okbg};`:''}${v.badbg?`--bad-bg:${v.badbg};`:''}color-scheme:${v.dark?'dark':'light'}}
:root[data-skin="${s.id}"] body{background-color:var(--sky);background-image:${skinPattern(s.pattern,v.grid)};background-size:auto}
${v.suntext?`:root[data-skin="${s.id}"] .btn.primary,:root[data-skin="${s.id}"] .ltab[aria-selected="true"].el,:root[data-skin="${s.id}"] .scope .go,:root[data-skin="${s.id}"] .hero{color:${v.suntext}}`:''}`;
  }
  let bar=document.getElementById('previewBar');
  if(previewSkin){ if(!bar){bar=document.createElement('div');bar.id='previewBar';bar.className='preview-bar sticker';document.body.appendChild(bar);}
    bar.innerHTML=`預覽中：${esc(s.emoji+' '+s.title)} <button class="btn small" id="endPreview">結束預覽</button>`;
    bar.querySelector('#endPreview').onclick=()=>{previewSkin=null;applySkin();parentOn?renderParent():renderHome()}; }
  else if(bar) bar.remove();
}

    modal(`<svg viewBox="0 0 100 100" style="width:110px;height:110px">${s.body('wow')}</svg><h2>兌換成功！</h2><p>你得到了「${esc(s.title)}」，要現在換上嗎？</p>`,
      [['等一下','',()=>renderShop()],['馬上換上','primary',()=>{skinId=s.id;store.set('skin',skinId);applySkin();renderShop();}]]);});

const SCOPES=[{id:1,name:'第 1 次段考',desc:'前段單元'},{id:2,name:'第 2 次段考',desc:'中段單元＋前段複習'},{id:3,name:'第 3 次段考',desc:'後段單元＋前面複習'},{id:'all',name:'全冊總複習',desc:'第 1～3 次段考全部題目'}];
// 國小學校科目：第 1、2 次段考；國中與何嘉仁、大家說英語：三個段考／階段
const examCount=(g,s)=> (g<=6 && !NOVER.includes(s)) ? 2 : 3;
function scopesFor(g,s){
  const n=examCount(g,s);
  return SCOPES.filter(x=>x.id==='all'||x.id<=n).map(x=>{
    if(n===2 && x.id===2) return Object.assign({},x,{desc:'後段單元＋前段複習'});
    if(x.id==='all') return Object.assign({},x,{desc:`第 1～${n} 次段考全部題目`});
    return x; });
}
function scopeLabel(sc,s){ if(!NOVER.includes(s)) return sc;
  const M={1:['基礎階段','打好基本功'],2:['進階階段','基礎＋進階題'],3:['挑戰階段','進階＋挑戰題'],all:['全部總複習','所有階段的題目']}[sc.id];
  return Object.assign({},sc,{name:M[0],desc:M[1]}); }
function scopeKey(ver,g,s,sc){return [ver,g,s,sc].join('-')}
function poolOf(ver,g,s,es){return BANK.filter(q=>q.g===g&&q.s===s&&es.includes(q.e)&&(!q.v||q.v===ver))}
function prepQ(q){
  q = Object.assign({}, q);
  if(q.type==='mc' && !q.opts.some(o=>/以上|皆/.test(o))){
    const order = shuffle([0,1,2,3], Math.random);
    q.opts = order.map(i=>q.opts[i]); if(q.optImgs) q.optImgs = order.map(i=>q.optImgs[i]); q.ans = order.indexOf(q.ans);
  }
  return q;
}
// 先抽最近沒出現過的題目，不夠再用出現過的，讓每次進來的題目都不一樣
function pickFresh(list,k,seenSet){
  const fresh=shuffle(list.filter(q=>!seenSet.has(q.id)),Math.random);
  const old=shuffle(list.filter(q=>seenSet.has(q.id)),Math.random);
  return fresh.concat(old).slice(0,k);
}
// 考卷大題結構：參考國中小段考卷的大題與配分。[大題名稱, 題型, 題數, 每題分數, 是否題組/閱讀長題]
// 國小每份 30 題，國中每份 50–60 題，每份滿分 100 分；某大題題目不夠時，用同範圍其他題型補足並保留配分
const PAPER={
  el:{
    chinese:[['一、字音字形（填充）','fill',6,2],['二、是非題','tf',4,2],['三、選擇題','mc',16,4],['四、閱讀理解','mc',4,4,1]],
    math:[['一、是非題','tf',5,2],['二、選擇題','mc',15,3],['三、填充題（計算與應用）','fill',10,4.5]],
    life:[['一、是非題','tf',10,3],['二、選擇題','mc',20,3.5]],
    english:[['一、是非題','tf',5,2],['二、選擇題','mc',20,3],['三、填充題','fill',5,6]],
    nature:[['一、是非題','tf',10,2],['二、選擇題','mc',16,4],['三、題組題','mc',2,4,1],['四、填充題','fill',2,4]],
    society:[['一、是非題','tf',10,2],['二、選擇題','mc',16,4],['三、題組題','mc',2,4,1],['四、填充題','fill',2,4]],
  },
  jh:{
    chinese:[['一、國字注音（填充）','fill',10,1],['二、注釋（填充）','fill',10,2],['三、改錯（填充）','fill',10,1],['四、選擇題','mc',25,2],['五、閱讀測驗','mc',4,2.5,1]],
    english:[['一、字彙填空','fill',10,1],['二、文法選擇','mc',25,2],['三、是非判斷','tf',5,2],['四、閱讀測驗','mc',10,3,1]],
    math:[['一、選擇題','mc',30,2],['二、填充題','fill',20,2]],
    nature:[['一、選擇題','mc',36,2],['二、題組題','mc',8,2,1],['三、填充題','fill',6,2]],
    geo:[['一、單題','mc',40,2],['二、題組','mc',10,2,1]],
  }
};
['his','civ'].forEach(k=>PAPER.jh[k]=PAPER.jh.geo); PAPER.jh.earth=PAPER.jh.nature; PAPER.jh.ltie=PAPER.jh.english; PAPER.el.hess=PAPER.el.english;
function paperOf(g,s){ const L=g>=7?PAPER.jh:PAPER.el; return L[s]||(g>=7?PAPER.jh.geo:PAPER.el.society); }
const paperCount=(g,s)=>paperOf(g,s).reduce((a,x)=>a+x[2],0);
const isLongQ=q=>q.type==='mc'&&(q.q.length>=70||/【題組】|閱讀|短文|下表|附表|根據|承上題|文章/.test(q.q));
function buildPaper(ver,g,s,sc){
  const sk=[ver,g,s].join('-'); const seenSet=new Set(seen[sk]||[]);
  // 1) 決定題目來源：單次段考＝本次約八成＋前面範圍約兩成；全冊＝各次平均
  let pool;
  if(sc==='all'){ pool=[1,2,3].map(e=>poolOf(ver,g,s,[e])).filter(p=>p.length); }
  else { const main=poolOf(ver,g,s,[sc]), review=sc>1?poolOf(ver,g,s,[1,2,3].filter(e=>e<sc)):[]; pool=review.length?[main,main,main,main,review]:[main]; }
  const all=[...new Set(pool.flat())]; if(!all.length) return {qs:[],avail:0};
  // 輪流從各來源抽，維持比例
  const used=new Set();
  const draw=(test,k)=>{ const out=[]; const lists=pool.map(p=>pickFresh(p.filter(q=>!used.has(q.id)&&test(q)),99999,seenSet)); let i=0, guard=0;
    while(out.length<k && lists.some(l=>l.length) && guard++<20000){ const l=lists[i++%lists.length]; while(l.length&&used.has(l[0].id)) l.shift(); if(l.length){ const q=l.shift(); used.add(q.id); out.push(q);} }
    return out; };
  const secs=paperOf(g,s).map(([t,type,n,pts,long])=>({t,type,n,pts,long,qs:[]}));
  // 2) 依大題抽題（先抽長題組、填充、是非，再抽一般選擇，避免被選擇題搶走）
  const order=[...secs].sort((a,b)=>(b.long?3:b.type==='fill'?2:b.type==='tf'?1:0)-(a.long?3:a.type==='fill'?2:a.type==='tf'?1:0));
  for(const sec of order){ const test=sec.long?isLongQ:(q=>q.type===sec.type&&!(sec.type==='mc'&&isLongQ(q)&&secs.some(x=>x.long)));
    sec.qs=draw(test,sec.n); }
  // 3) 題目不夠的大題，用其他題型補足（保留該大題配分）
  for(const sec of order){ if(sec.qs.length<sec.n) sec.qs=sec.qs.concat(draw(q=>q.type==='mc',sec.n-sec.qs.length)); }
  for(const sec of order){ if(sec.qs.length<sec.n) sec.qs=sec.qs.concat(draw(()=>true,sec.n-sec.qs.length)); }
  const live=secs.filter(x=>x.qs.length);
  // 4) 配分換算成滿分 100（題庫不足時等比例放大）
  const raw=live.reduce((a,x)=>a+x.qs.length*x.pts,0), k=100/raw;
  const qs=[]; live.forEach((sec,si)=>sec.qs.forEach(q=>{ const p=prepQ(q);
    p._sec = (sec.long||q.type===sec.type) ? sec.t : ((sec.t.match(/^[一二三四五六七八九十]+、/)||[''])[0]+TYPE_NAME[q.type]);
    p._pts=Math.round(sec.pts*k*100)/100; qs.push(p); }));
  seen[sk]=(seen[sk]||[]).filter(id=>!used.has(id)).concat([...used]).slice(-800); store.set('seen',seen);
  return {qs, avail:all.length, want:paperCount(g,s)};
}
function fmtPts(x){return Number.isInteger(x)?String(x):x.toFixed(1).replace(/\.0$/,'')}

/* ---------- PARENT MODE ---------- */
const VALID_S = ['chinese','math','english','life','nature','earth','society','geo','his','civ','hess','ltie'];
const KEY_ORDER = ['id','s','g','e','v','unit','type','q','img','opts','optImgs','ans','exp','trap'];
function validateQ(q){
  if(!q || typeof q!=='object') return '不是題目物件';
  if(typeof q.id!=='string'||!q.id.trim()) return '缺少 id';
  if(!VALID_S.includes(q.s)) return `${q.id}：科目 s 不正確`;
  if(!Number.isInteger(q.g)||q.g<1||q.g>9) return `${q.id}：年級 g 要是 1–9`;
  if(![1,2,3].includes(q.e)) return `${q.id}：段考 e 要是 1–3`;
  if(q.v!==undefined && !VERS.some(x=>x.id===q.v)) return `${q.id}：版本 v 要是 kang/nan/han`;
  if(typeof q.q!=='string'||!q.q.trim()) return `${q.id}：缺少題目 q`;
  if(q.type==='mc'){ if(!Array.isArray(q.opts)||q.opts.length!==4||!q.opts.every(o=>typeof o==='string')) return `${q.id}：選擇題要有 4 個選項`;
    if(![0,1,2,3].includes(q.ans)) return `${q.id}：選擇題 ans 要是 0–3`; }
  else if(q.type==='tf'){ if(typeof q.ans!=='boolean') return `${q.id}：是非題 ans 要是 true/false`; }
  else if(q.type==='fill'){ if(!Array.isArray(q.ans)||!q.ans.length||!q.ans.every(a=>typeof a==='string')) return `${q.id}：填充題 ans 要是文字陣列`; }
  else return `${q.id}：題型 type 要是 mc/tf/fill`;
  if(typeof q.exp!=='string'||!q.exp.trim()) return `${q.id}：缺少詳解 exp`;
  if(q.img!==undefined && (typeof q.img!=='string'||!/^(data:image\/|https?:\/\/|img\/)/.test(q.img))) return `${q.id}：附圖 img 格式不正確`;
  if(q.optImgs!==undefined && (q.type!=='mc'||!Array.isArray(q.optImgs)||q.optImgs.length!==4||!q.optImgs.every(s=>typeof s==='string'))) return `${q.id}：選項圖片 optImgs 要有 4 張`;
  return null;
}
function normalizeQ(q){
  const o={}; for(const k of KEY_ORDER){ if(q[k]===undefined) continue; if((k==='opts'||k==='optImgs')&&q.type!=='mc') continue; o[k]=q[k]; }
  if(o.unit===undefined) o.unit=''; if(o.trap===undefined) o.trap='';
  const r={}; for(const k of KEY_ORDER) if(o[k]!==undefined) r[k]=o[k]; return r;
}
// 解析 questions.js（window.QUESTION_BANK = [...]）或純 JSON 陣列
function parseBankText(text){
  text=String(text).replace(/^﻿/,'');
  const a=text.indexOf('['), b=text.lastIndexOf(']');
  if(a<0||b<a) throw new Error('找不到題目陣列 [ ... ]');
  const arr=JSON.parse(text.slice(a,b+1));
  if(!Array.isArray(arr)) throw new Error('內容不是陣列');
  const ok=[], errs=[];
  arr.forEach(q=>{const e=validateQ(q); if(e) errs.push(e); else ok.push(normalizeQ(q));});
  return {ok, errs};
}
function mergeInto(list){
  list.forEach(fixSubj);
  let added=0, updated=0, same=0;
  const idx=new Map(BANK.map((q,i)=>[q.id,i]));
  for(const q of list){
    if(idx.has(q.id)){ const i=idx.get(q.id); if(JSON.stringify(BANK[i])===JSON.stringify(q)) same++; else { BANK[i]=q; updated++; } }
    else { idx.set(q.id,BANK.length); BANK.push(q); added++; }
  }
  return {added, updated, same};
}
// 依照原本 questions.js 的格式輸出（每題一行，與 Python json.dumps 相同的間距）
function ser(v){
  if(Array.isArray(v)) return '['+v.map(ser).join(', ')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).map(k=>JSON.stringify(k)+': '+ser(v[k])).join(', ')+'}';
  return JSON.stringify(v);
}
function serializeBank(list){
  return '// 星星考題樂園 題庫（可直接編輯；格式說明見 README.md）\nwindow.QUESTION_BANK = [\n'+list.map(q=>ser(normalizeQ(q))).join(',\n')+'\n];\n';
}

if(HOST) HOST.addEventListener('message', ev=>{const d=ev.data||{}; if(d.event==='progress'){ if(typeof progressHandler==='function') progressHandler(d.text); return; } const p=pending.get(d.reqId); if(p){pending.delete(d.reqId); p(d);} });

async function importQuestions(text, from, replace){

  if(!P.ok.length){ box.className='msg bad'; box.textContent=`${from} 沒有可用的題目。\n${P.errs.slice(0,5).join('\n')}`; return; }
  let R;
  if(replace){ const newIds=new Set(P.ok.map(q=>q.id)); const removed=BANK.filter(q=>!newIds.has(q.id)).length;
    const old=new Map(BANK.map(q=>[q.id,JSON.stringify(q)]));
    R={added:P.ok.filter(q=>!old.has(q.id)).length, updated:P.ok.filter(q=>old.has(q.id)&&old.get(q.id)!==JSON.stringify(q)).length, same:P.ok.filter(q=>old.get(q.id)===JSON.stringify(q)).length, removed};
    BANK.length=0; P.ok.forEach(q=>BANK.push(q)); }
  else R=mergeInto(P.ok);
  let saved='';

    saved = r.ok ? `\n已寫入 data\\questions.js（舊檔備份為 ${r.backup||'questions.backup.js'}）。` : `\n寫入 questions.js 失敗：${r.error}`; }
  else if(replace){ saved='\n網頁版無法改寫題庫檔，完全同步只在 Windows 程式中有效。'; }
  else { const ex=store.get('extraBank',[]); const m=new Map(ex.map(q=>[q.id,q])); P.ok.forEach(q=>m.set(q.id,q)); store.set('extraBank',[...m.values()]); saved='\n已存在這台裝置的瀏覽器裡（網頁版無法改寫 questions.js）。'; }
  box.className='msg ok';
  box.textContent=`${from} 分析完成：新增 ${R.added} 題、更新 ${R.updated} 題、相同 ${R.same} 題${R.removed?`、移除 ${R.removed} 題`:''}${P.errs.length?`、略過 ${P.errs.length} 題格式不符`:''}。題庫現在共 ${BANK.length} 題。${saved}${P.errs.length?'\n略過原因（前 5 筆）：\n'+P.errs.slice(0,5).join('\n'):''}`;
  renderBankStats();
}

async function saveBankEdits(){
  const box=$('#bvMsg'); box.hidden=false;
  const errs=[]; for(const [id,q] of BV_EDIT){ if(BV_DEL.has(id)) continue; const e=validateQ(q); if(e) errs.push(e); }
  if(errs.length){ box.className='msg bad'; box.textContent='有題目還不完整，請修正後再儲存：\n'+errs.slice(0,8).join('\n'); return; }
  const delN=BV_DEL.size, edN=[...BV_EDIT.keys()].filter(id=>!BV_DEL.has(id)).length;
  for(let i=BANK.length-1;i>=0;i--){ const id=BANK[i].id; if(BV_DEL.has(id)) BANK.splice(i,1); else if(BV_EDIT.has(id)) BANK[i]=normalizeQ(BV_EDIT.get(id)); }
  wrongBook=wrongBook.filter(id=>!BV_DEL.has(id)); store.set('wrong',wrongBook);
  if(HOST){ const r=await hostCall({type:'saveBank',content:serializeBank(BANK)});
    if(!r.ok){ box.className='msg bad'; box.textContent='寫入 questions.js 失敗：'+r.error; return; }
    box.className='msg ok'; box.textContent=`已儲存：修改 ${edN} 題、刪除 ${delN} 題，題庫現在共 ${BANK.length} 題。原本的檔案已備份為「${r.backup||'questions.backup.js'}」。`;
  } else {
    const ex=store.get('extraBank',[]); const m=new Map(ex.map(q=>[q.id,q])); for(const [id,q] of BV_EDIT) if(!BV_DEL.has(id)) m.set(id,normalizeQ(q));
    store.set('extraBank',[...m.values()]); box.className='msg ok'; box.textContent=`已儲存在這台裝置的瀏覽器裡（網頁版無法改寫 questions.js${delN?'，刪除只在 Windows 程式中有效':''}）。`;
  }
  BV_EDIT.clear(); BV_DEL.clear(); renderBankStats(); const msg=box.textContent, cls=box.className; renderBankBrowser(); const b2=$('#bvMsg'); b2.hidden=false; b2.className=cls; b2.textContent=msg;
}

// ---------- 考卷 PDF／圖片 → 頁面影像（給裁切附圖用） ----------
let pdfReady=null;
function loadPdfJs(){ if(window.pdfjsLib) return Promise.resolve(); if(pdfReady) return pdfReady;
  pdfReady=new Promise((res,rej)=>{const s=document.createElement('script');s.src='lib/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';res()};s.onerror=()=>rej(new Error('找不到 lib/pdf.min.js'));document.head.appendChild(s)}); return pdfReady; }
const readAs=(f,how)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r[how](f)});
async function filePages(files){
  const pages=[];  // 每一頁一個 canvas，依檔案順序編號
  for(const f of files){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      await loadPdfJs(); const buf=await readAs(f,'readAsArrayBuffer');
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
      for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:2});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; pages.push(c); }
    } else {
      const url=await readAs(f,'readAsDataURL'); const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); pages.push(c);
    }
  }
  return pages;
}
function cropFig(pages,fig){
  if(!fig||!Array.isArray(fig.box)||fig.box.length!==4) return null;
  const c=pages[(fig.page|0)-1]; if(!c) return null;
  let [x0,y0,x1,y1]=fig.box.map(Number); if([x0,y0,x1,y1].some(isNaN)) return null;
  const pad=12; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(1000,x1+pad); y1=Math.min(1000,y1+pad);
  const sx=c.width*x0/1000, sy=c.height*y0/1000, sw=c.width*(x1-x0)/1000, sh=c.height*(y1-y0)/1000; if(sw<8||sh<8) return null;
  const k=Math.min(1,800/sw); const o=document.createElement('canvas'); o.width=Math.round(sw*k); o.height=Math.round(sh*k);
  const g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,o.width,o.height); g.drawImage(c,sx,sy,sw,sh,0,0,o.width,o.height);
  return o.toDataURL('image/jpeg',0.78);
}

/* ---------- 本機考卷轉題庫：PDF 文字層／Windows 內建 OCR → 規則解析 → 編輯 → 寫入本機 questions.js ---------- */
let importDraft=[];          // 編輯中的題目（含 _keep、_flag 等暫存欄位）
let importPages=[];          // 頁面影像（canvas），裁切附圖用
const CJK='\\u2E80-\\u9FFF\\uF900-\\uFAFF\\uFF00-\\uFFEF\\u3000-\\u303F';
function cjkFix(s){
  return String(s||'').replace(new RegExp(`([${CJK}])\\s+(?=[${CJK}])`,'g'),'$1')
    .replace(new RegExp(`([${CJK}])\\s+(?=[A-Za-z0-9(（])`,'g'),'$1')
    .replace(/\s{2,}/g,' ').trim();
}
const toHalf=s=>String(s).replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));

// 讀檔：每頁 {canvas, lines:[{text,x,y}] 或 null（需要 OCR）, file}
async function loadDocPages(files,show){
  const pages=[];
  for(const f of files){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      await loadPdfJs(); const doc=await pdfjsLib.getDocument({data:new Uint8Array(await readAs(f,'readAsArrayBuffer'))}).promise;
      for(let i=1;i<=doc.numPages;i++){
        show(`讀取「${f.name}」第 ${i}/${doc.numPages} 頁…`);
        const pg=await doc.getPage(i); const vp=pg.getViewport({scale:2});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
        await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        const tc=await pg.getTextContent(); const items=tc.items.filter(it=>it.str&&it.str.trim());
        let lines=null;
        if(items.length>=15){
          const pts=items.map(it=>{const [x,y]=vp.convertToViewportPoint(it.transform[4],it.transform[5]);return {s:it.str,x,y,w:it.width*2}});
          pts.sort((a,b)=>a.y-b.y||a.x-b.x); lines=[];
          for(const p of pts){ const L=lines.find(l=>Math.abs(l.y-p.y)<7); if(L) L.parts.push(p); else lines.push({y:p.y,parts:[p]}); }
          lines=lines.map(l=>{l.parts.sort((a,b)=>a.x-b.x); let t=''; let prev=null; const words=[];
            for(const p of l.parts){ if(prev && p.x-(prev.x+prev.w)>14) t+=' '; t+=p.s; prev=p;
              const re=/\S+/g; let m; while((m=re.exec(p.s))) words.push({t:m[0],x:p.x+(p.s.length?m.index/p.s.length*p.w:0)}); }
            return {text:t,x:l.parts[0].x,y:l.y,words}; }).sort((a,b)=>a.y-b.y);
        }
        pages.push({canvas:c,lines,file:f.name});
      }
    } else {
      const url=await readAs(f,'readAsDataURL'); const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0);
      pages.push({canvas:c,lines:null,file:f.name});
    }
  }
  return pages;
}
// 掃描頁：交給 Windows 內建 OCR（不需網路）
async function ocrPages(pages,show){
  const need=pages.filter(p=>!p.lines);
  for(let i=0;i<need.length;i++){
    if(!HOST) throw new Error('「'+need[i].file+'」是掃描檔，需要在 Windows 程式中用內建 OCR 辨識（網頁版只能讀有文字的 PDF）');
    show(`OCR 文字辨識中（${i+1}/${need.length}）…`);
    let c=need[i].canvas; if(Math.max(c.width,c.height)>4000){ const k=4000/Math.max(c.width,c.height); const o=document.createElement('canvas'); o.width=c.width*k|0; o.height=c.height*k|0; o.getContext('2d').drawImage(c,0,0,o.width,o.height); c=o; }
    const r=await hostCall({type:'ocr',b64:c.toDataURL('image/png').split(',')[1],lang:'zh-Hant-TW'});
    if(!r.ok) throw new Error(r.error);

// 從檔名猜年級、科目、段考
function guessMeta(names){
  const s=names.join(' '); const m={};
  const G={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  let x=s.match(/([一二三四五六七八九])年級/); if(x) m.g=G[x[1]];
  x=s.match(/國([一二三])/); if(x && !m.g) m.g=6+G[x[1]];
  x=s.match(/(?:^|\D)([1-9])年級/); if(x && !m.g) m.g=+x[1];
  const S=[[/何嘉仁/,'hess'],[/大家說英語/,'ltie'],[/國語|國文/,'chinese'],[/數學/,'math'],[/英語|英文/,'english'],[/生活/,'life'],[/地科|地球科學/,'earth'],[/自然|生物|理化/,'nature'],[/地理/,'geo'],[/歷史/,'his'],[/公民/,'civ'],[/社會/,'society']];
  for(const [re,v] of S) if(re.test(s)){ m.s=v; break; }
  x=s.match(/第\s*([一二三123])\s*次/); if(x) m.e={'一':1,'二':2,'三':3}[x[1]]||+x[1];
  if(/期末/.test(s)&&!m.e) m.e=3;

}

// 題目解析（規則式）：題號、(A)(B)(C)(D)/①②③④ 選項、大題標題判斷題型

    const t=cjkFix(L.text); if(!t) return;

      if(/是非/.test(t)) mode='tf'; else if(/填充|填空/.test(t)) mode='fill'; else if(/選擇|單選|閱讀|題組/.test(t)) mode='mc'; else if(/計算|問答|簡答|作文|作圖/.test(t)) mode='skip';

    if(cur) cur.raw+=' '+t;
  }); });

    let raw=cjkFix(c.raw).replace(/<<[^>]*>>|《[^》]*》|第\s*\d+\s*[頁面][^。]*?(?=$|\s)/g,' ');
    const um=raw.match(/[(（]\s*(\d{1,2}\s*[-－]\s*\d{1,2})\s*[)）]/); raw=raw.replace(/[(（]\s*\d{1,2}\s*[-－]\s*\d{1,2}\s*[)）]/g,' ');
    raw=raw.replace(/\s+(?:圖|表)[一二三四五六七八九十\d]+\s*$/,'').replace(/\s{2,}/g,' ').trim();
    const q={_unit:um?um[1].replace(/\s/g,''):'',_n:c.n,_sec:c.sec,_page:c.page,_y:c.y,type:c.mode==='tf'?'tf':c.mode==='fill'?'fill':'mc',q:raw,opts:['','','',''],ans:c.mode==='tf'?true:c.mode==='fill'?['']:0};

    if(/[圖表]/.test(q.q) && !/(圖書|表示|表現|表達|代表|發表|表格中文)/.test(q.q)) q._needImg=true;

// 答案卷解析：「1.B 2.C」「1 (A)」「1.○ 2.×」
function parseAnswerKey(pages){
  const norm=v=>{v=toHalf(v); return {'①':'A','②':'B','③':'C','④':'D','○':'O','✓':'O','ˇ':'O','×':'X','✕':'X','✗':'X'}[v]||v.toUpperCase();};
  const out=[];
  pages.forEach(P=>{
    const lines=P.lines||[];
    // 1) 同一行「1.B 2.C」「1 (A)」
    const text=lines.map(l=>cjkFix(l.text)).join('\n'); const re=/(\d{1,3})\s*[.、．:：)）]\s*[(（]?\s*([A-Da-dＡ-Ｄ①②③④○ＯO×XＸ✕✗])(?![A-Za-z])/g; let m;
    const inline=[]; while((m=re.exec(text))) inline.push({n:+m[1],a:norm(m[2])});
    // 2) 表格：一列題號、下一列答案，依水平位置配對
    const nums=[], ans=[];
    lines.forEach(l=>(l.words&&l.words.length?l.words:[{t:l.text,x:l.x}]).forEach(w=>{
      const s=toHalf(w.t).trim();
      if(/^\d{1,3}$/.test(s)) nums.push({n:+s,x:w.x,y:l.y});
      else if(/^[A-DＡ-Ｄ①②③④○ＯO×XＸ✕✗]$/.test(w.t.trim())) ans.push({a:norm(w.t.trim()),x:w.x,y:l.y});
    }));
    const grid=[];
    ans.forEach(A=>{ let best=null,bd=1e9;
      nums.forEach(N=>{ if(N.used) return; const dy=A.y-N.y; if(dy<=0||dy>160) return; const dx=Math.abs(A.x-N.x); if(dx>45) return; const d=dx*3+dy; if(d<bd){bd=d;best=N;} });
      if(best){ best.used=true; grid.push({n:best.n,a:A.a,y:best.y,x:best.x}); } });
    grid.sort((p,q)=>Math.abs(p.y-q.y)>40?p.y-q.y:p.x-q.x);

  });

}
function applyKey(qs,key){
  let pos=0, hit=0;
  for(const q of qs){
    let j=-1; for(let k=pos;k<key.length;k++){ if(key[k].n===q._n){ j=k; break; } }
    if(j<0) continue; const a=key[j].a; pos=j+1;
    if(q.type==='mc' && /[ABCD]/.test(a)){ q.ans='ABCD'.indexOf(a); q._ansOk=true; hit++; }
    else if(q.type==='tf' && /^[OX]$/.test(a)){ q.ans=a==='O'; q._ansOk=true; hit++; }
  }
  return hit;
}
function defaultExp(q,src){

  if(q.type==='mc') return `正確答案是 (${'ABCD'[q.ans]}) ${q.opts[q.ans]||''}。${tail}`;
  if(q.type==='tf') return `這個敘述是${q.ans?'正確':'錯誤'}的。${tail}`;

/* ---------- 線上 AI 判讀考卷（v3.0）：頁面影像＋PDF 文字 → 線上免費 AI → 題目、選項、答案、附圖位置、詳解 ---------- */
function pageJpeg(c,maxSide=2000,q=.85){
  let o=c; const m=Math.max(c.width,c.height);
  if(m>maxSide){ const k=maxSide/m; o=document.createElement('canvas'); o.width=Math.round(c.width*k); o.height=Math.round(c.height*k);
    const g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,o.width,o.height); g.drawImage(c,0,0,o.width,o.height); }
  return o.toDataURL('image/jpeg',q).split(',')[1];
}
function aiJSON(t){
  t=String(t||'').replace(/```(?:json)?/gi,'').trim();
  const a=t.indexOf('['), o=t.indexOf('{'); const s=(a>=0&&(o<0||a<o))?a:o; if(s<0) throw new Error('AI 回傳的不是 JSON');
  // 逐字掃描找出完整的 JSON；輸出被截斷時，保留到最後一個完整的元素
  let depth=0, inStr=false, esc=false, lastEl=-1, end=-1;
  for(let i=s;i<t.length;i++){ const c=t[i];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==='['||c==='{') depth++;
    else if(c===']'||c==='}'){ depth--; if(depth===1) lastEl=i; if(depth===0){ end=i; break; } }
  }
  if(end>0) return JSON.parse(t.slice(s,end+1));
  if(t[s]==='['&&lastEl>0) return JSON.parse(t.slice(s,lastEl+1)+']');
  throw new Error('AI 回傳的 JSON 不完整');
}
async function aiAsk(prompt,images,show){

function pageTextHint(P){ return (P.lines||[]).map(l=>cjkFix(l.text)).join('\n'); }
function boxToFig(b,pageIdx){
  if(!Array.isArray(b)||b.length!==4) return null; let v=b.map(Number); if(v.some(isNaN)) return null;
  if(v.every(x=>x<=1.001)) v=v.map(x=>x*1000);                       // 有些模型回傳 0–1

  return {page:pageIdx+1,box:[x0,y0,x1,y1]};
}
const SUBJ_HINT={math:'數學式照抄，分數寫成 3/4，次方寫成 x²，根號寫成 √',english:'英文題目與選項照原文抄寫，不要翻譯',chinese:'注音、國字照抄；注音符號題保留注音',nature:'化學式與單位照抄（如 H₂O、cm³）'};

    if(!p||sz(q)>sz(p)) best.set(k,p?Object.assign(q,{_ord:p._ord}):q); }
  const qs=[...best.values()].sort((a,b)=>a._ord-b._ord);
  qs.forEach((q,i)=>{ Object.assign(q,{id:`imp-${stamp}-${String(i+1).padStart(3,'0')}`,s:meta.s,g:meta.g,e:meta.e,unit:q._unit?`第 ${q._unit} 課`:'',_keep:true});
    if(meta.v) q.v=meta.v;
    if(q.exp){ q.exp+=meta.src?`（出處：${meta.src}）`:''; q._autoExp=false; } else { q.exp=defaultExp(q,meta.src); q._autoExp=true; } });
  return {qs,keyCount:key.length};
}

async function runImport(files){
  const box=$('#impMsg'); const show=(t,cls='')=>{box.hidden=false;box.className='msg '+cls;box.textContent=t};
  const total=files.reduce((a,f)=>a+f.size,0); if(total>60*1024*1024){show('檔案太大（合計超過 60MB），請分批匯入','bad');return}
  const guess=guessMeta(files.map(f=>f.name));
  ['G','S','E'].forEach(k=>{const el=$('#imp'+k); const v=guess[k.toLowerCase()]; if(el && !el.value && v) el.value=v;});
  const meta={g:+$('#impG').value||0,s:$('#impS').value,e:+$('#impE').value||0,v:$('#impV').value,src:$('#impSrc').value.trim()};
  if(!meta.g||!meta.s||!meta.e){show('請先選好年級、科目、段考（檔名裡有寫的會自動帶入），再選一次檔案','bad');return}
  try{
    show('讀取檔案中…');
    // 答案卷：檔名含「答案、解答、詳解」，或成對的教用卷（「(教)」「教用」「教師」）＋學生卷（「(學)」「學用」）
    const isTeach=f=>/[(（]\s*教\s*[)）]|教用|教師版/.test(f.name), isStu=f=>/[(（]\s*學\s*[)）]|學用|學生版/.test(f.name);
    const pairMode=files.some(isTeach)&&files.some(isStu);
    const isKey=f=>/答案|解答|詳解|ans|key/i.test(f.name)||(pairMode&&isTeach(f));
    const qFiles=files.filter(f=>!isKey(f)), kFiles=files.filter(isKey);
    const qPages=await loadDocPages(qFiles.length?qFiles:files,show);
    const kPages=kFiles.length?await loadDocPages(kFiles,show):[];
    importPages=qPages.concat(kPages).map(p=>p.canvas);
    // 優先用線上 AI 判讀（題目、選項、答案、附圖、詳解一次完成）
    let online=false; if(HOST){ const st=await hostCall({type:'aiStatus'}); online=!!(st&&st.ready); }
    if(online){
      try{
        const {qs,keyCount}=await runOnlineImport(meta,qPages,kPages,show);
        if(qs.length){
          importDraft=qs;
          const imgN=qs.filter(q=>q.img||q.optImgs).length, unsure=qs.filter(q=>!q._ansOk).length;
          show(`線上 AI 找到 ${qs.length} 題${keyCount?`（答案卷 ${keyCount} 個答案）`:''}，自動附上 ${imgN} 題的圖片，詳解已產生。${unsure?`有 ${unsure} 題的答案是 AI 自行解題（黃色標示），請確認。`:''}請逐題檢查，圖片框得不準可按「更換附圖」重新框選，最後按「加入本機題庫」。`,'ok');
          renderDraft(); return;
        }
        show('線上 AI 沒有找到題目，改用本機規則解析…');
      }catch(e){ if(!e.notConfigured) show('線上 AI 判讀失敗，改用本機規則解析：'+e.message); }
    }
    await ocrPages(qPages.concat(kPages),show);
    const qs=parseExamLines(qPages);
    if(!qs.length){show('沒有找到題目。請確認考卷題號是「1.」「1、」或「(1)」這類格式；掃描檔請確認 Windows 已安裝中文（繁體）OCR。','bad');return}
    const key=parseAnswerKey(kPages.length?kPages:qPages); const hit=applyKey(qs,key);
    const stamp=new Date().toISOString().replace(/\D/g,'').slice(0,14);
    qs.forEach((q,i)=>{ Object.assign(q,{id:`imp-${stamp}-${String(i+1).padStart(3,'0')}`,s:meta.s,g:meta.g,e:meta.e,unit:q._unit?`第 ${q._unit} 課`:'',exp:'',trap:'',_keep:true}); if(meta.v) q.v=meta.v; q.exp=defaultExp(q,meta.src); q._autoExp=true; });
    importDraft=qs;
    show(`找到 ${qs.length} 題，從答案卷對到 ${hit} 題答案。請逐題檢查題目、選項與答案（沒對到答案的題目以黃色標示），需要的題目按「加附圖」從原稿框選圖片，最後按「加入本機題庫」。`,'ok');
    renderDraft();
  }catch(e){ show('匯入失敗：'+e.message,'bad'); }
}

// 從原稿框選附圖
function openCropper(i){
  if(!importPages.length){ toast('沒有原稿頁面可以框選'); return; }
  const q=importDraft[i]; let pi=Math.min(q._page||0,importPages.length-1); let sel=null;
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal sticker crop-modal" role="dialog" aria-modal="true"><h2>框選附圖</h2><p class="note">用滑鼠在圖片上拖曳框出要附上的圖（含圖說），再按「使用這個範圍」。</p>
    <div class="extra-row"><button class="btn small" data-p="-1">← 上一頁</button><span class="tag" id="cpInfo"></span><button class="btn small" data-p="1">下一頁 →</button></div>
    <div class="crop-wrap"><canvas id="cpCanvas"></canvas></div>
    <div class="extra-row"><button class="btn" data-x="cancel">取消</button><button class="btn primary" data-x="ok">使用這個範圍</button></div></div>`;
  document.body.appendChild(bg);
  const cv=bg.querySelector('#cpCanvas'), g=cv.getContext('2d');
  const draw=()=>{ const src=importPages[pi]; const k=Math.min(1,900/src.width); cv.width=src.width*k; cv.height=src.height*k; cv._k=k;
    g.drawImage(src,0,0,cv.width,cv.height); if(sel){ g.fillStyle='rgba(91,124,250,.18)'; g.strokeStyle='#E5484D'; g.lineWidth=3; const [x0,y0,x1,y1]=sel; g.fillRect(x0,y0,x1-x0,y1-y0); g.strokeRect(x0,y0,x1-x0,y1-y0); }
    bg.querySelector('#cpInfo').textContent=`第 ${pi+1} / ${importPages.length} 頁`; };
  let start=null; const pos=e=>{const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{start=pos(e); sel=null; cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{ if(!start) return; const p=pos(e); sel=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])]; draw(); };
  cv.onpointerup=()=>{start=null;};
  bg.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ pi=Math.max(0,Math.min(importPages.length-1,pi+ +b.dataset.p)); sel=null; draw(); });
  bg.querySelector('[data-x=cancel]').onclick=()=>bg.remove();
  bg.querySelector('[data-x=ok]').onclick=()=>{ if(!sel||sel[2]-sel[0]<10){toast('請先框選範圍');return}
    const k=cv._k, src=importPages[pi]; const box=sel.map((v,j)=>Math.round((v/k)/(j%2?src.height:src.width)*1000));
    const im=cropFig(importPages,{page:pi+1,box}); if(im){ q.img=im; q._needImg=false; } bg.remove(); renderDraft(); };
  draw();
}

      show(`本機 AI 產生詳解中（${Math.min(i+3,list.length)}/${list.length}），電腦較慢時每批可能要 1–2 分鐘…`);
      const items=batch.map((q,k)=>{ const ansStr=q.type==='mc'?`(${'ABCD'[q.ans]}) ${q.opts[q.ans]}`:q.type==='tf'?(q.ans?'正確（O）':'錯誤（X）'):q.ans.join('、');
        return `【第${k}題】${q.type==='mc'?'選擇題':q.type==='tf'?'是非題':'填充題'}\n題目：${q.q}\n${q.type==='mc'?q.opts.map((o,j)=>`(${'ABCD'[j]}) ${o}`).join('\n')+'\n':''}正確答案：${ansStr}`; }).join('\n\n');
      const prompt=`你是台灣${GRADE_NAME[batch[0].g]}${subjName(batch[0].s,batch[0].g)}老師。請為下面每一題寫給學生看的詳解，一定要使用繁體中文（台灣用語），不要用簡體字。正確答案已經給定，請說明為什麼是這個答案；數學、理化要列出算式；選擇題順便說明錯誤選項錯在哪。
只輸出 JSON 陣列，不要其他文字，格式：[{"i":題號數字,"exp":"2-4句詳解","trap":"1句常見錯誤"}]

${items}`;
      const r=await hostCall({type:'llmLocal',prompt,model:st.recommended});
      if(!r.ok) throw new Error(r.error+(done?`（已完成 ${done} 題）`:''));
      try{ const t=r.text; const arr=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1));
        arr.forEach(o=>{ const q=batch[+o.i]; if(q && o.exp){ q.exp=String(o.exp).trim()+(src?`（出處：${src}）`:''); if(o.trap) q.trap=String(o.trap).trim(); q._autoExp=false; done++; } });
      }catch(e){ /* 這一批格式不對，略過 */ }
    }
    show(done?`本機 AI 已補上 ${done} 題詳解，請檢查內容是否正確。`:'本機 AI 沒有回傳可用的詳解，請再按一次試試。', done?'ok':'bad');
    renderDraft();
  }catch(e){ progressHandler=null; show('本機 AI 無法使用：'+e.message,'bad'); }
  finally{ const b=$('#impLLM'); if(b) b.disabled=false; }
}

async function commitImport(){
  const box=$('#impMsg'); box.hidden=false;
  const pick=[], errs=[];
  importDraft.filter(q=>q._keep).forEach(q=>{
    const o={}; Object.keys(q).forEach(k=>{ if(!k.startsWith('_')) o[k]=q[k]; });
    if(o.type==='fill') o.ans=(o.ans||[]).filter(Boolean); if(o.type!=='mc'){ delete o.opts; }
    const e=validateQ(o); if(e) errs.push(`#${q._n}：${e.replace(/^[^：]+：/,'')}`); else pick.push(normalizeQ(o));
  });
  if(errs.length){ box.className='msg bad'; box.textContent=`有 ${errs.length} 題還沒填完整，請修正或取消勾選：\n`+errs.slice(0,8).join('\n'); return; }
  if(!pick.length){ toast('沒有勾選題目'); return; }
  const have=new Set(BANK.map(q=>q.id)); const add=pick.filter(q=>!have.has(q.id)); add.forEach(q=>BANK.push(q));
  if(!add.length){ box.className='msg'; box.textContent='這些題目本機題庫已經有了，沒有新增。'; return; }
  if(HOST){
    const s=await hostCall({type:'saveBank',content:serializeBank(BANK)});
    box.className='msg '+(s.ok?'ok':'bad');
    box.textContent = s.ok ? `已新增 ${add.length} 題到本機 wwwroot\\data\\questions.js（共 ${BANK.length} 題）。原本的檔案已備份為「${s.backup||'questions.backup.js'}」。` : `寫入本機 questions.js 失敗：${s.error}`;
  } else {
    const ex=store.get('extraBank',[]); store.set('extraBank',ex.concat(add));
    box.className='msg ok'; box.textContent=`已新增 ${add.length} 題（網頁版存在這台裝置的瀏覽器裡）。`;
  }
  importDraft=[]; importPages=[]; renderDraft(); renderBankStats();
}

/* ---------- confetti ---------- */
function confetti(count){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#FFC93C','#FF6F61','#2EC4A0','#5B7CFA','#FFB4E0'];
  const ps=Array.from({length:count},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*5)],star:Math.random()<.3}));
  let f=0;(function draw(){cx.clearRect(0,0,cv.width,cv.height);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      if(p.star){cx.font=`${p.s*2}px sans-serif`;cx.fillText('★',0,0)}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    if(++f<240)requestAnimationFrame(draw);else cx.clearRect(0,0,cv.width,cv.height)})();
}

applySkin();

// 開啟程式時自動同步雲端題庫（每天一次，只新增／更新，不會刪除本機題目）
(async function autoSync(){
  if(!HOST||!cfg.autoSync||!cfg.updateUrl) return;
  const today=new Date().toISOString().slice(0,10); if(cfg.lastSyncDay===today) return;
  try{
    const r=await hostCall({type:'fetch',url:cfg.updateUrl}); if(!r.ok) return;
    const P=parseBankText(r.text); if(!P.ok.length) return;
    const R=mergeInto(P.ok);
    if(R.added||R.updated){ const s=await hostCall({type:'saveBank',content:serializeBank(BANK)}); if(s.ok) toast(`雲端題庫已更新：新增 ${R.added} 題、更新 ${R.updated} 題`); }
    cfg.lastSyncDay=today; cfg.lastSync=new Date().toLocaleString('zh-TW')+`（新增 ${R.added}、更新 ${R.updated}）`; saveCfg();
  }catch(e){}
})();
